name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish-npm:
    name: Publish npm package
    if: github.repository == 'thurstonsand/pi-doppelclaude'
    permissions:
      contents: read
      id-token: write
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - name: Set synchronized package versions from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/set-release-version.mjs "$version"
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Build and pack dry run
        run: |
          mise run build
          npm pack --dry-run --workspace doppelclaude
          npm pack --dry-run --workspace pi-doppelclaude
          npm pack --dry-run --workspace http-doppelclaude

      - name: Publish core first, then frontends
        run: |
          npm publish --workspace doppelclaude --access public --tag latest
          npm publish --workspace pi-doppelclaude --access public --tag latest
          npm publish --workspace http-doppelclaude --access public --tag latest

  fork-release:
    name: Publish fork GitHub release
    if: github.repository == 'mistrjirka/pi-doppelclaude'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - name: Prepare synchronized workspace versions
        run: |
          node scripts/set-release-version.mjs "${GITHUB_REF_NAME#v}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci

      - name: Build complete workspace
        run: mise run build

      - name: Publish built workspace archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$(scripts/pack-built-workspace.sh "$RUNNER_TEMP")"
          scripts/extract-release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" "$archive" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
